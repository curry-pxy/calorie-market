# 替换成自己的证书路径后放到 /etc/nginx/conf.d/calorie.conf
# 证书：阿里云免费证书下载 Nginx 格式，上传到 /etc/nginx/ssl/

server {
    listen 80;
    server_name chuanyan.top www.chuanyan.top;

    # Let's Encrypt 等自动签发的预留目录，不需要可删
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name chuanyan.top www.chuanyan.top;

    ssl_certificate     /etc/nginx/ssl/chuanyan.top.pem;
    ssl_certificate_key /etc/nginx/ssl/chuanyan.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
